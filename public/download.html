<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/daisyui/4.4.19/full.min.css" rel="stylesheet" type="text/css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #1a1a2e, #16213e);
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slug-container {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .slug-container:hover {
            background: rgba(15, 23, 42, 0.8);
        }
        .animated-gradient {
            background: linear-gradient(270deg, #3b82f6, #2563eb);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0% {background-position: 0% 50%}
            50% {background-position: 100% 50%}
            100% {background-position: 0% 50%}
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
        <div class="card glass-effect shadow-2xl">
            <div class="card-body p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-white mb-2">Download Your File</h1>
                    <p class="text-gray-400">Secure file transfer system</p>
                </div>
                
                <!-- File ID Display with Copy Button -->
                <div class="slug-container p-6 mb-8">
                    <label class="text-sm font-medium text-gray-400 mb-2 block">File Identifier</label>
                    <div class="flex items-center gap-4">
                        <code class="flex-1 text-lg font-mono bg-gray-800 p-3 rounded text-blue-400">${slug}</code>
                        <button 
                            class="btn btn-ghost btn-sm hover:bg-gray-700 transition-colors duration-200"
                            id="copyBtn"
                            onclick="copySlug()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            <span class="ml-2">Copy</span>
                        </button>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-control mb-8">
                    <label class="label">
                        <span class="label-text text-gray-300 font-medium">Password Protection</span>
                        <span class="label-text-alt text-gray-500">Required if set</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="passwordInput" 
                            placeholder="Enter file password" 
                            class="input input-bordered w-full bg-gray-800 border-gray-700 focus:border-blue-500 transition-colors"
                        />
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Error Alert -->
                <div id="errorAlert" class="alert alert-error mb-6 hidden">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span id="errorMessage" class="flex-1">Error message here</span>
                        <button class="btn btn-ghost btn-sm" onclick="dismissError()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Download Button -->
                <button 
                    id="downloadBtn" 
                    class="btn btn-primary btn-lg w-full animated-gradient border-0 hover:brightness-110 transition-all duration-200" 
                    onclick="downloadFile()">
                    <span id="loadingSpinner" class="loading loading-spinner loading-md hidden mr-2"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download File
                </button>
            </div>
        </div>
    </div>

    <script>
        const slug = `<?= $slug ?>`;
        console.log('Slug:', slug);

        function downloadFile() {
            const password = document.getElementById('passwordInput').value;
            const downloadBtn = document.getElementById('downloadBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // Show loading state
            downloadBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');

            fetch(`/api/download/${slug}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password })
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error(response.statusText);
            })
            .then(data => {
                if (data.url) {
                    const a = document.createElement('a');
                    a.href = data.url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    throw new Error('Download URL not found in response.');
                }
            })
            .catch(error => {
                console.error('Download error:', error);
                showError(error.message);
            })
            .finally(() => {
                // Reset loading state
                downloadBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
            });
        }

        function copySlug() {
            navigator.clipboard.writeText(slug).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="ml-2">Copied!</span>
                `;
                setTimeout(() => {
                    copyBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        <span class="ml-2">Copy</span>
                    `;
                }, 2000);
            });
        }

        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorAlert.classList.remove('hidden');
        }

        function dismissError() {
            document.getElementById('errorAlert').classList.add('hidden');
        }
    </script>
</body>
</html>
